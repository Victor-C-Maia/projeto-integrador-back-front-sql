<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Escolar</title>

    <link rel="stylesheet" href="/css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="layout">

    <!-- Barra lateral -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-school"></i>

            <h2>Sistema Escolar</h2>

        </div>

        <nav>

            <button id="menu-dashboard">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </button>

            <button id="menu-alunos">

                <i class="fa-solid fa-user-graduate"></i>

                Alunos

            </button>

            <button id="menu-professores">

                <i class="fa-solid fa-chalkboard-user"></i>

                Professores

            </button>

            <button id="menu-disciplinas">

                <i class="fa-solid fa-book"></i>

                Disciplinas

            </button>

            <button id="menu-turmas">

                <i class="fa-solid fa-users"></i>

                Turmas

            </button>

            <button id="menu-matriculas">

                <i class="fa-solid fa-address-card"></i>

                Matrículas

            </button>

            <button id="menu-notas">

                <i class="fa-solid fa-star"></i>

                Notas

            </button>

            <button id="menu-boletim">

                <i class="fa-solid fa-file-lines"></i>

                Boletim

            </button>

        </nav>

    </aside>

    <!-- Conteúdo -->

    <main class="conteudo">

        <header class="topbar">

            <h1 id="titulo-pagina">

                Dashboard

            </h1>

        </header>

        <section id="conteudo-principal">

            <div class="card">

                <h2>Bem-vindo!</h2>

                <p>

                    Este é o Sistema Escolar desenvolvido em
                    <strong>Node.js + Express + PostgreSQL</strong>.

                </p>

                <br>

                <p>

                    Utilize o menu lateral para acessar os módulos do sistema.

                </p>

            </div>

        </section>

    </main>

</div>

<script src="/js/core/api.js"></script>
<script src="/js/core/ui.js"></script>

<script src="/js/modules/dashboard.js"></script>
<script src="/js/modules/alunos.js"></script>
<script src="/js/modules/professores.js"></script>
<script src="/js/modules/disciplinas.js"></script>
<script src="/js/modules/turmas.js"></script>
<script src="/js/modules/matriculas.js"></script>
<script src="/js/modules/notas.js"></script>
<script src="/js/modules/boletim.js"></script>

<script src="/js/core/main.js"></script>

</body>

</html>
